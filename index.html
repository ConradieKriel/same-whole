<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="A short, interactive maths tutorial on adding fractions with different denominators.">
  <title>Same Whole — Adding fractions</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="#top" aria-label="Same Whole home">
      <span class="wordmark-mark" aria-hidden="true">sw.</span>
      <span class="wordmark-name">SAME WHOLE</span>
    </a>
    <p class="masthead-note">A short maths tutorial</p>
  </header>

  <main id="top" class="layout">
    <aside class="side-rail" aria-label="Tutorial progress">
      <p class="rail-kicker">YOUR ROUTE</p>
      <nav id="stage-nav" class="stage-nav">
        <button class="stage-link is-active" data-stage="0" type="button" aria-current="step"><span>01</span><span>Explain</span></button>
        <button class="stage-link" data-stage="1" type="button"><span>02</span><span>Watch</span></button>
        <button class="stage-link" data-stage="2" type="button"><span>03</span><span>Together</span></button>
        <button class="stage-link" data-stage="3" type="button"><span>04</span><span>On your own</span></button>
      </nav>
      <div class="rail-rule"></div>
      <section class="tutor-note" aria-label="Meet your tutor">
        <div class="tutor-heading">
          <svg class="tutor-portrait" viewBox="0 0 76 76" role="img" aria-label="Illustration of Mika, your maths guide">
            <circle cx="38" cy="38" r="37" fill="#e6d7c1"/>
            <path d="M13 68c3-14 12-21 25-21s22 7 25 21" fill="#53634f"/>
            <path d="M23 33c0-15 7-23 17-23 12 0 18 9 16 25l-4 13H25z" fill="#34342f"/>
            <ellipse cx="39" cy="34" rx="15" ry="18" fill="#a96f4e"/>
            <path d="M24 30c1-13 9-19 18-18 8 1 13 7 14 15-6-2-10-7-12-10-4 7-11 11-20 13" fill="#34342f"/>
            <path d="M33 37h2m9 0h2" stroke="#282b27" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M35 45c2 2 6 2 8 0" fill="none" stroke="#75432f" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M27 56c4 4 19 4 24 0" fill="none" stroke="#e6d7c1" stroke-width="2"/>
          </svg>
          <div>
            <p class="tutor-overline">YOUR GUIDE</p>
            <h2 id="tutor-name">Mika</h2>
          </div>
        </div>
        <p id="tutor-welcome" class="tutor-copy">We'll take this one line at a time. You do the thinking; I'll help when you need a nudge.</p>
        <div class="tutor-tools">
          <button id="speak-button" class="text-button" type="button" aria-pressed="false">Read aloud <span aria-hidden="true">↗</span></button>
          <button id="stop-speech" class="text-button stop-speech" type="button" hidden>Stop reading</button>
        </div>
      </section>
      <p class="rail-footnote">No timer. Take the time you need.</p>
    </aside>

    <section class="lesson-area" aria-live="off">
      <div class="lesson-topline">
        <span id="stage-count">PART 1 OF 4</span>
        <span id="stage-label">EXPLAIN</span>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
      <div id="lesson-content" class="lesson-content" tabindex="-1"></div>
      <div class="lesson-controls">
        <button id="back-button" class="button button-quiet" type="button" disabled>← Back</button>
        <span id="control-note" class="control-note">Start with the idea, not a formula.</span>
        <button id="next-button" class="button button-primary" type="button">Continue <span aria-hidden="true">→</span></button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Same Whole</span>
    <span>Maths, made a little clearer.</span>
  </footer>

  <noscript><p class="noscript">This tutorial needs JavaScript to check your working. Please enable JavaScript in your browser.</p></noscript>
</body>
</html>
